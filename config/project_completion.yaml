project: crc-unmet-need-therapeutic-atlas
phase: source_only_registry
scope_boundary:
  includes:
    - source landing pages and accessions
    - file and archive inventories
    - reproducible download paths
    - metadata contracts and UNKNOWN rules
    - scheduled metadata scans and update PRs
    - review, audit and handoff records
  excludes:
    - biological file downloads
    - biological matrix generation
    - expression/dependency/drug-response analysis
    - target ranking or therapeutic-window conclusions
completion_endpoint:
  percent: 100
  max_points: 90
  definition: The source-only phase reaches 100% when every source-only engineering requirement is complete; scientific/clinical analysis readiness is tracked separately and is not required for this endpoint.
  scorecard_interpretation: The 90-point weighted score measures materialized infrastructure and provenance capacity; a 90/90 score does not by itself assert that the source-only completion endpoint is closed.
  current_status: COMPLETE
  unresolved_internal_requirements: []
  closure_matrix_completion_rule: A closure matrix is complete for the source-only endpoint when every candidate has a source manifest plus a file inventory or explicit no-file-inventory disposition, and no row has INTERNAL_ACTION_REQUIRED; SOURCE_INDEXED_REVIEW_REQUIRED rows are retained dataset-review handoffs and do not block this endpoint.
  internal_requirements:
    - closure_matrix_is_complete
    - every_update_target_has_scan_disposition
    - final_closure_pr_is_merged
    - validator_tests_and_no_data_audit_pass
  external_blocker_allowlist:
    - upstream_requires_interactive_authentication
    - upstream_file_or_metadata_not_public
    - user_has_not_staged_external_file
score_weights:
  registry_admission_architecture: 10
  source_index_layer: 15
  validator_tests: 10
  update_scan_system: 10
  pr_review_audit: 10
  p0_gate_design: 10
  exact_dataset_provenance: 15
  closure_handoff: 10
readiness_overlay:
  # LEGACY as of 2026-08-21: this scorecard belongs to the archived phase2
  # fetal-state/plasticity discovery track (see
  # ../archive/phase2_fetal_state_track_v1/ARCHIVE_NOTE.md) and is frozen,
  # not advanced further. It is kept for provenance, not as current
  # readiness. Do not treat remaining_components below as this
  # repository's next steps -- see adc_target_repurposing_readiness.
  scientific_clinical_readiness_legacy_phase2:
    max_points: 10
    current_points: 7
    current_stage: phase2_external_cohort_coverage_audit
    frozen: true
    completed_components:
      - falsifiable_question_and_novelty_boundary
      - five_figure_evidence_skeleton
      - GSE178318_data_lock
      - FIG1_MARKER_V1_lock
      - GSE178318_structural_qc
      - explicit_cell_qc_rules_v1
      - three_rule_qc_retention_execution
      - patient_level_descriptive_state_score
      - paired_effect_direction_analysis
      - HTAN_source_cohort_replication_audit
      - CRLM_NMP_ATLAS_external_coverage_audit
    remaining_components_not_pursued:
      - independent_primary_metastasis_validation
      - functional_dependency_and_therapeutic_window
      - clinical_indication_mapping
    excluded_from_source_only_completion: true
  # Current readiness track, target-first, as of the 2026-08-21 pivot
  # (Asset-Generation-OS-architecture.md -> CRC-Atlas工业化重构). Not yet
  # scored numerically -- no target has gone through Modules B-F end to
  # end, so there is nothing to weight a score against.
  adc_target_repurposing_readiness:
    current_stage: module_a_seed_universe_produced
    completed_components:
      - ADC_ATLAS_DATASET_CONTRACT
      - modules_b_through_f_scoped
      - module_classification_schema_and_validator
      - target_seed_and_target_evidence_schemas
      - target_id_added_to_evidence_and_indication_links
      - thirteen_pivot_candidates_phase1_source_verification
      - ADC_TARGET_SEED_UNIVERSE_produced
    remaining_components:
      - first_target_through_module_b_and_e_end_to_end
      - target_seed_universe_coverage_beyond_a_clinical_tier
    excluded_from_source_only_completion: true
gates:
  - source_manifest
  - file_or_archive_inventory
  - download_method
  - update_target
  - review_status
  - remaining_blocker
  - no_biological_data
