# Logical references to Module A (DERISKED_TARGET_UNIVERSE), which is
# maintained outside this repository and not redeveloped here. Added
# 2026-08-21 after web-ChatGPT review of PR #70 (REQUEST_CHANGES, item 1):
# do not hardcode machine-specific paths in prose docs (README.md,
# ADC_ATLAS_DATASET_CONTRACT.md, modules/README.md) — reference this file
# instead, and resolve each source's actual location via its path_env_var
# on whatever machine is running the pipeline.
module_a_derisked_target_universe:
  description: >
    ADCdb-derived seed target universe (clinical trials, publications,
    regulatory filings, patents). This repository consumes its output
    (see output_contract below) as an input list of candidate targets;
    it does not maintain its own copy of the underlying source data.
  sources:
    - id: adcdb_published
      description: Published ADCdb (Nucleic Acids Research), as-is.
      path_env_var: ADCDB_PUBLISHED_PATH
      example_local_path: /Volumes/Stelligen_SSD/Stelligen/DATA/1.Databases/ADCdb/ADCdb_Obsidian
    - id: adcdb_claude_redo
      description: >
        Clinical trials + publications + regulatory + patents layer,
        reusable directly (no redevelopment needed in this repository).
      path_env_var: ADCDB_CLAUDE_REDO_PATH
      example_local_path: /Volumes/Stelligen_SSD/Stelligen/DATA/1.Databases/ADCdb/ADCdb_Claude_redo
  output_contract: schemas/target_seed.tsv
  output_file_name: ADC_TARGET_SEED_UNIVERSE.tsv
  notes: >
    example_local_path values are informational only (what resolves on the
    machine that authored this pivot) and must never be read directly by a
    script; scripts must resolve the corresponding path_env_var and fail
    closed with a clear error if it is unset, not fall back to the example
    path.

# Logical reference to Module E's GTEx bulk-RNA component. Added 2026-08-23,
# corrected round 2 of PR #73's review: the HPA half of Module E's normal-
# tissue screen (both RNA and IHC) is NOT an external path_env_var resource --
# it is this repository's own canonical DATA/registry/HPA_normal_tissue
# dataset, whose two files (rna_tissue_hpa.tsv.zip, normal_ihc_data.tsv.zip)
# are already tracked with SHA256 in that dataset's own source_manifest.tsv
# and physically present (gitignored) at
# archive/phase2_fetal_state_track_v1/phase2/03_data/raw/HPA_normal_tissue/,
# downloaded 2026-08-11 during the pre-pivot phase2 track. See
# scripts/extract_normal_tissue_rna.py, which resolves that fixed
# repo-relative path directly and checksum-verifies against the manifest --
# no env var needed for something this repository already tracks itself.
# Only GTEx v11 median TPM is a genuinely external, cross-project resource
# (reused from another project's DATA/1.Databases entry), so only it needs
# the fail-closed path_env_var pattern below, same as Module A.
module_e_gtex_bulk_rna_reference:
  description: >
    GTEx v11 adult gene-level median TPM by tissue, 68 tissues. Bulk tissue
    RNA only. GTEx_normal_tissue is a registered CANDIDATE dataset in
    DATA/registry/datasets.tsv (module_classification.tsv: REFERENCE_SUPPORT)
    -- this section does not change that registry status; its own
    source_manifest.tsv is backfilled with the exact file this points to.
  sources:
    - id: gtex_v11_median_tpm
      description: GTEx v11 adult gene-level median TPM by tissue, 68 tissues.
      path_env_var: GTEX_V11_MEDIAN_TPM_PATH
      example_local_path: /Volumes/Stelligen_SSD/Stelligen/DATA/1.Databases/GTEx_v11_median_tpm
  output_contract: schemas/target_evidence.tsv
  notes: >
    example_local_path is informational only and must never be read directly
    by a script; scripts must resolve path_env_var and fail closed with a
    clear error if it is unset.
