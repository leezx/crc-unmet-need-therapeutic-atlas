# Logical references to Module A (DERISKED_TARGET_UNIVERSE), which is
# maintained outside this repository and not redeveloped here. Added
# 2026-08-21 after web-ChatGPT review of PR #70 (REQUEST_CHANGES, item 1):
# do not hardcode machine-specific paths in prose docs (README.md,
# ADC_ATLAS_DATASET_CONTRACT.md, modules/README.md) — reference this file
# instead, and resolve each source's actual location via its path_env_var
# on whatever machine is running the pipeline.
module_a_derisked_target_universe:
  description: >
    ADCdb-derived seed target universe (clinical trials, publications,
    regulatory filings, patents). This repository consumes its output
    (see output_contract below) as an input list of candidate targets;
    it does not maintain its own copy of the underlying source data.
  sources:
    - id: adcdb_published
      description: Published ADCdb (Nucleic Acids Research), as-is.
      path_env_var: ADCDB_PUBLISHED_PATH
      example_local_path: /Volumes/Stelligen_SSD/Stelligen/DATA/1.Databases/ADCdb/ADCdb_Obsidian
    - id: adcdb_claude_redo
      description: >
        Clinical trials + publications + regulatory + patents layer,
        reusable directly (no redevelopment needed in this repository).
      path_env_var: ADCDB_CLAUDE_REDO_PATH
      example_local_path: /Volumes/Stelligen_SSD/Stelligen/DATA/1.Databases/ADCdb/ADCdb_Claude_redo
  output_contract: schemas/target_seed.tsv
  output_file_name: ADC_TARGET_SEED_UNIVERSE.tsv
  notes: >
    example_local_path values are informational only (what resolves on the
    machine that authored this pivot) and must never be read directly by a
    script; scripts must resolve the corresponding path_env_var and fail
    closed with a clear error if it is unset, not fall back to the example
    path.

# Logical references to Module E's bulk-RNA normal-tissue screen. Added
# 2026-08-23 for the first real Module E target run. HPA_normal_tissue and
# GTEx_normal_tissue are registered CANDIDATE datasets in
# DATA/registry/datasets.tsv (module_classification.tsv: CORE_ACTIVE /
# REFERENCE_SUPPORT) -- this section does not change that registry status.
# It documents where an already-fetched, checksum-verified local copy of
# each dataset's RNA-only component can be read from, on whatever machine
# runs scripts/extract_normal_tissue_rna.py -- same fail-closed
# path_env_var pattern as Module A, and the same rule: this is not a new
# download, and the script must never read example_local_path directly.
module_e_normal_tissue_bulk_rna_reference:
  description: >
    Official HPA RNA-tissue-consensus and GTEx v11 adult median-TPM bulk RNA
    references. Bulk tissue RNA only -- not IHC, not cell-type-resolved, not
    protein. Module E's own README requires a "protein/IHC-first triage" as
    the ideal; this reference is an UNCALIBRATED_PROXY screen pending that,
    per the module's own evidence_directness discipline. It can flag a
    tissue as *worth checking further* but a low/absent value here is never
    grounds to call a target "safe" in that tissue.
  sources:
    - id: hpa_rna_tissue_consensus
      description: >
        HPA RNA tissue consensus, long-format gene x tissue nTPM, 40
        tissues. The RNA-only component of the broader HPA_normal_tissue
        registry entry (which also covers IHC + ~76 annotated cell types,
        not available locally in this form).
      path_env_var: HPA_RNA_TISSUE_CONSENSUS_PATH
      example_local_path: /Volumes/Stelligen_SSD/Stelligen/DATA/1.Databases/HPA_RNA_tissue_consensus
    - id: gtex_v11_median_tpm
      description: GTEx v11 adult gene-level median TPM by tissue, 68 tissues.
      path_env_var: GTEX_V11_MEDIAN_TPM_PATH
      example_local_path: /Volumes/Stelligen_SSD/Stelligen/DATA/1.Databases/GTEx_v11_median_tpm
  output_contract: schemas/target_evidence.tsv
  notes: >
    example_local_path values are informational only and must never be read
    directly by a script; scripts must resolve the corresponding
    path_env_var and fail closed with a clear error if it is unset.
